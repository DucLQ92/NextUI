# PKM - Pokemon mini
# NextUI default preset for the pokemini core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

minarch_screen_scaling = Native
pokemini_video_scale = 5x
pokemini_60hz_mode = enabled
pokemini_palette = Old
pokemini_piezofilter = disabled
pokemini_lowpass_filter = enabled

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind A Button = A
bind B Button = B
bind C Button = R1
bind Shake = L1
bind Power = SELECT
