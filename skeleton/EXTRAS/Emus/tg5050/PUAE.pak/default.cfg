# PUAE - Commodore Amiga
# NextUI default preset for the puae2021 core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

# kill the border; the picture roughly doubles
puae_crop = auto
puae_crop_mode = both
# kept from the original Brick preset: hires costs more than it gives here
puae_video_resolution = lores
puae_video_standard = PAL auto
puae_video_allow_hz_change = locked
puae_cpu_compatibility = normal
puae_floppy_speed = 100
puae_floppy_multidrive = enabled
puae_sound_interpol = anti
puae_sound_filter = emulated
puae_floppy_sound_empty_mute = enabled

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind A / 2nd fire / Blue = A
bind B / Fire / Red = B
bind X / Yellow = X
bind Y / Green = Y
bind Start / Play = START
bind Select = SELECT
bind L / Rewind = L1
bind R / Forward = R1
bind L2 = L2
bind R2 = R2
bind L3 = L3
bind R3 = R3
