# VB - Virtual Boy
# NextUI default preset for the mednafen_vb core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

# kept from the original pak: the VB core does not hold 50fps at Auto
minarch_cpu_speed = Performance
vb_3dmode = anaglyph
vb_right_analog_to_digital = disabled

bind L. Up = UP
bind L. Down = DOWN
bind L. Left = LEFT
bind L. Right = RIGHT
bind Select = SELECT
bind Start = START
bind A = A
bind B = B
bind L Button = L1
bind R Button = R1
bind Low Battery = NONE:X
bind R. Up = NONE:L2
bind R. Down = NONE:L3
bind R. Left = NONE:R2
bind R. Right = NONE:R3
