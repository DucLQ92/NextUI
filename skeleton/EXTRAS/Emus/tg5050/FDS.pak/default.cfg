# FDS - Famicom Disk System
# NextUI default preset for the fceumm core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

fceumm_sndquality = High
fceumm_sndvolume = 10
# tames the harsh square waves on a small speaker
fceumm_sndlowpass = enabled
fceumm_aspect = 8:7 PAR
fceumm_turbo_enable = Player 1
fceumm_show_adv_system_options = disabled
fceumm_show_adv_sound_options = disabled

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind A Button = A
bind B Button = B
bind A Turbo = NONE:X
bind B Turbo = NONE:Y
bind Change Disk = L1
bind Insert Disk = R1
bind Insert Coin = NONE:R2
