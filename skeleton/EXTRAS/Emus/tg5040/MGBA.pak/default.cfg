# MGBA - Game Boy Advance (mGBA)
# NextUI default preset for the mgba core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

mgba_skip_bios = ON
# same reason as the gpsp pak
mgba_color_correction = GBA
# GBA audio is 8-bit and hissy without it
mgba_audio_low_pass_filter = enabled

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind A Button = A
bind B Button = B
bind A Turbo = NONE:X
bind B Turbo = NONE:Y
bind L Button = L1
bind R Button = R1
bind L Turbo = NONE:L2
bind R Turbo = NONE:R2
bind More Sun = NONE:L3
bind Less Sun = NONE:R3
