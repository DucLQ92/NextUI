# GG - Sega Game Gear
# NextUI default preset for the picodrive core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

# 144p x5 is exactly 720 tall, same as Game Boy
minarch_screen_scaling = Native
picodrive_smstype = Game Gear
picodrive_smsmapper = Auto
picodrive_sound_rate = 44100
picodrive_ramcart = disabled
# was `disabled`, which is not a legal value for this option
picodrive_dacnoise = off
picodrive_input1 = 3 button pad
picodrive_input2 = 3 button pad
picodrive_fm_filter = off
picodrive_audio_filter = disabled
picodrive_overclk68k = disabled

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Button 1 = B
bind Button 2 = A
bind Pause = START
