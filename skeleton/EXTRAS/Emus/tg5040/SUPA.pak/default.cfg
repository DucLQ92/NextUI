# SUPA - Super Nintendo (Supafaust)
# NextUI default preset for the mednafen_supafaust core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

supafaust_pixel_format = rgb565
# emu on cores 0-1, PPU on cores 2-3
supafaust_thread_affinity_emu = 0x3
supafaust_thread_affinity_ppu = 0xc

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind Y Button = Y
bind X Button = X
bind B Button = B
bind A Button = A
bind L Button = L1
bind R Button = R1
