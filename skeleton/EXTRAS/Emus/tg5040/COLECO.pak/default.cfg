# COLECO - ColecoVision
# NextUI default preset for the gearcoleco core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

# The core defaults are already the right ones for this hardware.

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind X Button = X
bind Y Button = Y
bind B Button = B
bind A Button = A
bind L1 Button = L1
bind L2 Button = L2
bind R1 Button = R1
bind R2 Button = R2
