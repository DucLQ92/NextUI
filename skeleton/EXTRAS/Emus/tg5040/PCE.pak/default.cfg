# PCE - NEC PC Engine / TurboGrafx-16
# NextUI default preset for the mednafen_pce_fast core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

pce_fast_turbo_toggle_hotkey = disabled

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Run = START
bind I = A
bind II = B
bind III = Y
bind IV = X
bind V = L1
bind VI = R1
bind Mode = L2
