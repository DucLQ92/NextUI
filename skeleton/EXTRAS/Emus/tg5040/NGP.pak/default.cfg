# NGP - Neo Geo Pocket
# NextUI default preset for the race core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

# 160x152 integer-scales to nearly the full panel
minarch_screen_scaling = Native
race_dark_filter_level = 50
# this core is tiny; accurate audio is essentially free
race_audio_quality = accurate

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind A Button = B
bind B Button = A
bind Option = START
