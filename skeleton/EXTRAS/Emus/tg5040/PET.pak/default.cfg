# PET - Commodore PET
# NextUI default preset for the vice_xpet core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

# kill the border; the picture roughly doubles
vice_crop = auto
vice_crop_mode = both
# the panel is RGB565 anyway
vice_gfx_colors = 16bit
vice_autoloadwarp = enabled
vice_drive_sound_emulation = disabled

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind X Button = X
bind Y Button = Y
bind B Button = B
bind A Button = A
bind L1 Button = L1
bind L2 Button = L2
bind R1 Button = R1
bind R2 Button = R2
