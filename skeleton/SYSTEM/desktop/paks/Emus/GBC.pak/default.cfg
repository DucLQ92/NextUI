# GBC - Game Boy Color
# NextUI default preset for the gambatte core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

# 144p x5 is exactly 720 tall: integer scale, no shimmer
minarch_screen_scaling = Native
gambatte_gb_bootloader = disabled
gambatte_audio_resampler = sinc
# GBC games were authored for a dim reflective panel
gambatte_gbc_color_correction = GBC only

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind A Button = A
bind B Button = B
bind A Turbo = NONE:X
bind B Turbo = NONE:Y
bind Prev. Palette = NONE:L1
bind Next Palette = NONE:R1
