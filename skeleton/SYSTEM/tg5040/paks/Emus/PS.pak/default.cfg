# PS - Sony PlayStation
# NextUI default preset for the pcsx_rearmed core.
# Layer order: system.cfg, then this file, then whatever the player saves
# from the in-game Options menu. Nothing here is locked, so every line
# below shows up in that menu and can be changed per console or per game.

# pre-tuned in case Rewind is switched on; costs nothing while it is off
minarch_rewind_buffer_mb = 128
minarch_rewind_granularity = 33
minarch_rewind_compression_speed = 12
minarch_rewind_compression = On
pcsx_rearmed_dithering = enabled
# moves the SPU off the emulation core; this SoC has four
pcsx_rearmed_spu_thread = enabled

minarch_gamepad_type = 1
bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind Circle = A
bind Cross = B
bind Triangle = X
bind Square = Y
bind L1 Button = L1
bind R1 Button = R1
bind L2 Button = L2
bind R2 Button = R2
